# 로컬 개발용 스택. `docker compose up --build` 한 줄로 postgres/api/worker/client가
# 전부 뜬다. 배포(Render)와는 별개이며 render.yaml을 대체하지 않는다.
#
# api/worker는 저장소 루트가 빌드 컨텍스트다(rules.yaml이 server/ 밖에 있어서 —
# server/Dockerfile 상단 주석 참고). client는 별도로 client/ 자체가 컨텍스트다.
# api/worker는 같은 이미지를 쓴다(`image:` 태그를 동일하게 줘서 한 번만 빌드되게 함).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codecourt
      POSTGRES_PASSWORD: codecourt
      POSTGRES_DB: codecourt
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecourt -d codecourt"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: codecourt-server:local
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://codecourt:codecourt@postgres:5432/codecourt
      JWT_SECRET: local-dev-secret-not-for-production
      LLM_PROVIDER: fixture
      ENVIRONMENT: development
      RUN_WORKER_IN_APP: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: codecourt-server:local
    # alembic upgrade head는 "이미 적용된 뒤 재실행"엔 안전하지만, api와 동시에 뜨면
    # 둘 다 처음으로 alembic_version 테이블을 만들려다 경합해 한쪽이 죽는다(실측 확인됨:
    # UniqueViolationError on pg_type_typname_nsp_index). 그래서 postgres가 아니라
    # api의 healthcheck(마이그레이션을 이미 끝내고 응답 중)를 기다린다 — 워커 자신은
    # 마이그레이션을 다시 돌리지 않는다.
    command: sh -c "exec python -m app.worker_main"
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://codecourt:codecourt@postgres:5432/codecourt
      JWT_SECRET: local-dev-secret-not-for-production
      LLM_PROVIDER: fixture
      ENVIRONMENT: development

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"

volumes:
  pgdata:
