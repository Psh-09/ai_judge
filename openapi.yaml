            - charge_index: 2
              verdict: REDUCED
              final_severity: MEDIUM
              reasoning: >-
                except 범위가 넓은 것은 사실이나, 로깅이 포함되어 실패가
                은폐되지는 않는다.
            - charge_index: 3
              verdict: DISMISSED
              final_severity: null
              reasoning: 변론 인정. 스코프가 3줄이라 조항 적용이 과하다.
            - charge_index: 4
              verdict: DISMISSED
              final_severity: null
              reasoning: 상수의 의미가 인접 주석으로 설명되어 있어 가독성 저해가 없다.
          sentences:
            - sentence_id: 3fbb9e0a-3b3a-4a9e-8a1a-000000000001
              charge_index: 0
              task: 42번 줄 쿼리를 파라미터 바인딩으로 교체
              target_start: 42
              target_end: 42
