            rule_id: ERR-002
            rule_title: 광범위 예외 처리
            evidence_start: 155
            evidence_end: 158
            charged_severity: HIGH
            severity_adjusted: false
            severity_reason: null
            description: 최상위 예외 타입을 통째로 잡아 예상하지 못한 오류까지 삼킨다.
          - charge_index: 3
            rule_id: NAMING-002
            rule_title: 축약 변수명
            evidence_start: 17
            evidence_end: 17
            charged_severity: LOW
