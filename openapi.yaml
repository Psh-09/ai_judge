openapi: 3.0.3
info:
  title: Code Court API
  description: >
    대립형 코드 리뷰 서비스(검사→변호인→판사) API.
    상세 설계 근거는 docs/plans/plan.md, 화면 설계는 docs/design.md를 참고한다.
    이 문서가 request/response 스키마의 단일 출처(single source of truth)이며,
    plan.md는 이 문서를 참조만 하고 스키마를 중복 정의하지 않는다.
  version: "1.0.0"

servers:
  - url: /api/v1

security:
  - cookieAuth: []

tags:
  - name: auth
    description: 회원가입/로그인/토큰 재발급
  - name: rules
    description: 법전 열람
  - name: cases
    description: 사건 제출/조회/항소
  - name: sentences
    description: 형량 체크리스트
  - name: ops
    description: 운영/헬스체크

paths:
  /health:
    servers:
      - url: /
        description: 헬스체크는 버전 프리픽스(/api/v1) 없이 서버 루트에 노출된다.
    get:
      tags: [ops]
      summary: 헬스체크
      operationId: healthCheck
      description: 서버 프로세스가 요청을 처리할 수 있는 상태인지 확인한다. 인증이 필요 없다.
      security: []
      responses:
        "200":
          description: 서버가 정상 응답 중임
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/register:
    post:
      tags: [auth]
      summary: 회원가입
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: 이메일 중복
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: EMAIL_ALREADY_REGISTERED
                  message: 이미 가입된 이메일입니다.
                  details: {}

  /auth/login:
    post:
      tags: [auth]
      summary: 로그인 (httpOnly 쿠키 발급)
      operationId: loginUser
      description: >
        인증 성공 시 access_token/refresh_token을 httpOnly + Secure + SameSite=Lax
        쿠키로 내려준다. 토큰은 응답 본문에 포함하지 않는다(§인증 방식 참고).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공, Set-Cookie로 세션 발급
          headers:
            Set-Cookie:
              schema:
                type: string
              description: >
                access_token=...; HttpOnly; Secure; SameSite=Lax,
                refresh_token=...; HttpOnly; Secure; SameSite=Lax (두 개의
                Set-Cookie 헤더로 각각 전달됨)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "401":
          description: 이메일/비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: 이메일 또는 비밀번호가 올바르지 않습니다.
                  details: {}

  /auth/refresh:
    post:
      tags: [auth]
      summary: 액세스 토큰 재발급
      operationId: refreshToken
      description: 요청의 refresh_token 쿠키를 읽어 새 access_token 쿠키를 내려준다. 별도 요청 본문이 없다.
      security:
        - refreshCookieAuth: []
          csrfHeader: []
      responses:
        "200":
          description: 재발급 성공, Set-Cookie로 새 access_token 전달
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfCheckFailed"

  /auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃 (인증 쿠키 만료)
      operationId: logoutUser
      description: >
        access_token/refresh_token 쿠키를 즉시 만료시킨다. httpOnly 쿠키라 클라이언트
        JS로는 지울 수 없으므로 반드시 이 엔드포인트를 통해야 한다. 쿠키가 이미
        없거나 만료된 상태로 호출해도 200을 반환한다(멱등).
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "200":
          description: 로그아웃 처리됨, Set-Cookie로 두 쿠키 모두 만료
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "403":
          $ref: "#/components/responses/CsrfCheckFailed"

  /rules:
    get:
      tags: [rules]
      summary: 활성 법전 조항 목록
      operationId: listRules
      description: active=true인 조항만 반환한다.
      responses:
        "200":
          description: 조항 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
              example:
                - rule_id: SEC-003
                  category: SECURITY
                  title: SQL 문자열 결합
                  description: >-
                    사용자 입력이나 변수를 문자열 연결, 포맷 문자열, 템플릿 리터럴로
                    이어 붙여 SQL 쿼리를 만드는 경우. 파라미터 바인딩을 쓰거나,
                    결합되는 값이 코드 내 상수뿐이면 위반이 아니다.
                  default_severity: HIGH
                  typical_effort: SMALL
                  languages: [python, javascript, typescript, java]
                  active: true
                - rule_id: STRUCT-001
                  category: STRUCTURE
                  title: 함수 길이 과다
                  description: 단일 함수의 본문이 40줄을 넘는 경우.
                  default_severity: MEDIUM
                  typical_effort: LARGE
                  languages: []
                  active: true

  /cases:
    post:
      tags: [cases]
      summary: 사건 제출 (붙여넣기 또는 GitHub 링크)
      operationId: createCase
      description: >
        `code`+`language`(붙여넣기) 또는 `repo_url`(GitHub 링크) 중 정확히 하나를
        받는다. 둘 다 없거나 둘 다 있으면 400 VALIDATION_ERROR.
        캐시/진행중 사건 존재 여부에 따라 200(재사용) 또는 202(신규/재판)로 갈린다.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
            examples:
              paste:
                summary: 붙여넣기 제출
                value:
                  code: "query = \"SELECT * FROM users WHERE id = '\" + uid + \"'\"\n"
                  language: python
                  force_retrial: false
              githubLink:
                summary: GitHub 링크 제출
                value:
                  repo_url: https://github.com/octocat/sample-api/blob/a1b2c3d/src/handlers/user.py
                  force_retrial: false
      responses:
        "200":
          description: 캐시 히트(완료된 사건 재사용) 또는 진행 중 사건 재사용
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseSubmissionResult"
              examples:
                cachedSentenced:
                  summary: 이미 판결된 동일 코드
                  value:
                    case_id: 8f14e45f-ceea-4c6a-9f3b-000000000001
                    cached: true
                    origin:
                      type: github
                      repo_url: https://github.com/octocat/sample-api
                      commit_sha: a1b2c3d
                      file_path: src/handlers/user.py
                    origin_label: "octocat/sample-api@a1b2c3d · src/handlers/user.py"
                inProgress:
                  summary: 동일 코드가 이미 진행 중
                  value:
                    case_id: 8f14e45f-ceea-4c6a-9f3b-000000000002
                    cached: false
                    in_progress: true
        "202":
          description: 신규 사건 생성(또는 force_retrial로 재판 강행)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseSubmissionResult"
              examples:
                newCase:
                  summary: 신규 사건
                  value:
                    case_id: 8f14e45f-ceea-4c6a-9f3b-000000000003
                    cached: false
                retrial:
                  summary: 캐시 히트 후 force_retrial로 재판 강행
                  value:
                    case_id: 8f14e45f-ceea-4c6a-9f3b-000000000004
                    cached: false
                    previous_case_id: 8f14e45f-ceea-4c6a-9f3b-000000000001
        "400":
          description: 요청 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emptyCode:
                  value:
                    {
                      error:
                        {
                          code: EMPTY_CODE,
                          message: 코드가 비어 있습니다.,
                          details: {},
                        },
                    }
                tooLong:
                  value:
                    {
                      error:
                        {
                          code: CODE_TOO_LONG,
                          message: 코드가 500줄 또는 20000자를 초과했습니다.,
                          details: { max_lines: 500, max_chars: 20000 },
                        },
                    }
                invalidLanguage:
                  value:
                    {
                      error:
                        {
                          code: INVALID_LANGUAGE,
                          message: language 필드가 없거나 형식이 올바르지 않습니다.,
                          details: {},
                        },
                    }
                invalidRepoUrl:
                  value:
                    {
                      error:
                        {
                          code: INVALID_REPO_URL,
                          message: GitHub 파일(blob) 링크가 아닙니다.,
                          details: {},
                        },
                    }
                repoFileUnavailable:
                  value:
                    {
                      error:
                        {
                          code: REPO_FILE_UNAVAILABLE,
                          message: 파일을 불러올 수 없습니다. 공개 저장소인지 확인해 주세요.,
                          details: {},
                        },
                    }
        "403":
          $ref: "#/components/responses/CsrfCheckFailed"
        "409":
          description: 진행 중인 사건이 있는 상태에서 force_retrial 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: RETRIAL_BLOCKED
                  message: 진행 중인 사건이 있어 재판을 새로 시작할 수 없습니다.
                  details: {}
        "429":
          description: 일일 제출 한도 또는 GitHub fetch 한도 초과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rateLimited:
                  value:
                    {
                      error:
                        {
                          code: RATE_LIMITED,
                          message: 24시간 내 20건을 모두 사용했습니다.,
                          details:
                            {
                              limit: 20,
                              window: "24h",
                              retry_after_seconds: 41400,
                            },
                        },
                    }
                fetchRateLimited:
                  value:
                    {
                      error:
                        {
                          code: FETCH_RATE_LIMITED,
                          message: 링크 불러오기 횟수를 초과했습니다.,
                          details: { limit: 60, window: "24h" },
                        },
                    }
        "503":
          description: GitHub API 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: GITHUB_UNAVAILABLE
                  message: GitHub에서 파일을 가져오지 못했습니다. 잠시 후 다시 시도해 주세요.
                  details: {}

    get:
      tags: [cases]
      summary: 본인 사건 목록 (전과 기록)
      operationId: listCases
      description: 요청자가 소유한 사건만 최신순으로 페이지네이션해 반환한다.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 사건 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseListResponse"

  /cases/rule-frequency:
    get:
      tags: [cases]
      summary: 반복 조항 랭킹 (전과 기록)
      operationId: getRuleFrequency
      description: 요청자가 소유한 사건에서 자주 걸린 rule_id 상위 5개와 횟수를 반환한다.
      responses:
        "200":
          description: 반복 조항 랭킹
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleFrequencyResponse"
              example:
                items:
                  - rule_id: SEC-003
                    rule_title: SQL 문자열 결합
                    count: 4
                  - rule_id: STRUCT-001
                    rule_title: 함수 길이 과다
                    count: 3

  /cases/{case_id}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [cases]
      summary: 사건 상세(기소장+변론+판결+항소 정보 전체)
      operationId: getCase
      description: 코드 스냅샷, 기소장, 변론, 판결(총평/개별 판정/형량), 항소 정보를 한 번에 반환한다.
      responses:
        "200":
          description: 사건 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
              examples:
                sentencedCase:
                  $ref: "#/components/examples/CaseDetailExample"
        "404":
          $ref: "#/components/responses/CaseNotFound"

  /cases/{case_id}/progress:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [cases]
      summary: 진행 상태 폴링용 경량 응답
      operationId: getCaseProgress
      description: status/revision/appeal_used만 담은 경량 응답으로, 클라이언트가 2초 간격으로 폴링하는 용도다.
      responses:
        "200":
          description: 현재 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProgress"
              example:
                status: JUDGING
                revision: 0
                appeal_used: false
        "404":
          $ref: "#/components/responses/CaseNotFound"

  /cases/{case_id}/appeal:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      tags: [cases]
      summary: 항소 접수 (1회 한정)
      operationId: appealCase
      description: SENTENCED 상태이고 appeal_used=false인 사건만 접수 가능하며, 접수 즉시 appeal_used=true로 확정된다.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealRequest"
            example:
              rebuttal: >-
                이 함수는 단일 진입점 스크립트에서만 호출되므로 전역 변수 사용이
                의도된 설계입니다.
      responses:
        "202":
          description: 재심 접수됨(QUEUED_REJUDGMENT로 전이)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProgress"
              example:
                status: QUEUED_REJUDGMENT
                revision: 0
                appeal_used: true
        "400":
          description: rebuttal 20자 미만
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: REBUTTAL_TOO_SHORT
                  message: 항소 사유는 20자 이상 입력해야 합니다.
                  details: { min_length: 20 }
        "403":
          $ref: "#/components/responses/CsrfCheckFailed"
        "404":
          $ref: "#/components/responses/CaseNotFound"
        "409":
          description: 이미 판결 확정 상태가 아니거나 항소를 이미 사용함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: APPEAL_ALREADY_USED
                  message: 이미 항소를 사용한 사건입니다.
                  details: {}

  /sentences/{sentence_id}:
    parameters:
      - name: sentence_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [sentences]
      summary: 형량 체크리스트 항목 완료 토글
      operationId: toggleSentence
      description: 사건 status와 무관하게 언제든 토글 가능하다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SentenceToggleRequest"
            example:
              completed: true
      responses:
        "200":
          description: 토글 결과 + 사건 전체 이행률
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentenceToggleResponse"
              example:
                sentence_id: 3fbb9e0a-3b3a-4a9e-8a1a-000000000001
                completed_at: "2026-09-08T10:12:00Z"
                progress: { done: 1, total: 3 }
        "404":
          description: 존재하지 않거나 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: SENTENCE_NOT_FOUND
                  message: 형량 항목을 찾을 수 없습니다.
                  details: {}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: >
        httpOnly + Secure + SameSite=Lax 쿠키로 전달되는 JWT access_token.
        localStorage 등 JS로 접근 가능한 저장소는 쓰지 않는다(XSS 파급 범위 축소).
        상태 변경 요청(POST/PATCH)에는 CSRF 대응으로 커스텀 헤더 검증 또는
        Double Submit Cookie 패턴 중 하나가 함께 적용된다.
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: >
        httpOnly + Secure + SameSite=Lax 쿠키로 전달되는 refresh_token.
        access_token과는 별개의 쿠키이며 /auth/refresh에서만 쓰인다 —
        access_token이 만료된 상태에서 호출하는 엔드포인트이므로 access_token
        쿠키를 요구하면 안 된다.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Protection
      description: >
        쿠키 인증을 사용하는 상태 변경 요청(POST/PATCH/DELETE)에 필요한 CSRF 방어용
        커스텀 헤더. 값은 "1" 고정. 단순 폼 기반 요청은 커스텀 헤더를 실어 보낼 수 없고,
        fetch/XHR 기반 요청은 CORS preflight에서 차단되므로 별도 토큰 쿠키 없이
        동일한 방어 효과를 얻는다(선정 근거는 plan.md 참고).

  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: 요청 필드 검증 실패
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 인증 토큰 없음/만료/위조
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              { code: UNAUTHORIZED, message: 로그인이 필요합니다., details: {} }
    CaseNotFound:
      description: 존재하지 않거나 요청자가 소유자가 아닌 사건(403 대신 404 — 존재 여부 자체를 노출하지 않음)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              {
                code: CASE_NOT_FOUND,
                message: 사건을 찾을 수 없습니다.,
                details: {},
              }
    CsrfCheckFailed:
      description: X-CSRF-Protection 헤더가 없거나 값이 올바르지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: CSRF_CHECK_FAILED
              message: X-CSRF-Protection 헤더가 없거나 값이 올바르지 않습니다.
              details: {}

