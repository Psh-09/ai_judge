            - sentence_id: 3fbb9e0a-3b3a-4a9e-8a1a-000000000002
              charge_index: 1
              task: parse_and_save()를 파싱·검증·저장 세 함수로 분리
              target_start: 88
              target_end: 140
              effort: LARGE
              effort_adjusted: false
              effort_reason: null
              effort_clamped: false
              advisory: false
              rationale: 책임을 분리하면 각 단계를 독립적으로 테스트할 수 있다.
              completed_at: null
            - sentence_id: 3fbb9e0a-3b3a-4a9e-8a1a-000000000003
              charge_index: 2
              task: except 절을 예상 예외 타입으로 좁힘
              target_start: 155
              target_end: 158
              effort: MEDIUM
              effort_adjusted: false
              effort_reason: null
