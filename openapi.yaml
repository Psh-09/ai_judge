          - charge_index: 4
            rule_id: STYLE-001
            rule_title: 매직 넘버
            evidence_start: 63
            evidence_end: 63
            charged_severity: LOW
            severity_adjusted: false
            severity_reason: null
            description: 의미를 알 수 없는 숫자 리터럴이 로직에 직접 등장한다.
        pleas:
          - charge_index: 0
