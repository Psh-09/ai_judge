              completed_at: null
        appeal: null

  schemas:
    Severity:
      type: string
      enum: [HIGH, MEDIUM, LOW]

    Effort:
      type: string
      enum: [SMALL, MEDIUM, LARGE]

    VerdictValue:
      type: string
      enum: [SUSTAINED, REDUCED, DISMISSED]

    PleaValue:
      type: string
      enum: [ADMIT, DENY, NO_RESPONSE]

    CaseStatus:
      type: string
      enum:
        - QUEUED_PROSECUTION
        - PROSECUTING
        - QUEUED_DEFENSE
        - DEFENDING
        - QUEUED_JUDGMENT
        - JUDGING
        - SENTENCED
        - DISMISSED
        - QUEUED_REJUDGMENT
        - REJUDGING
        - FAILED

    FailedStage:
      type: string
      enum: [PROSECUTION, DEFENSE, JUDGMENT]
      nullable: true

    FailureReason:
      type: string
      enum: [SCHEMA_INVALID, TIMEOUT, API_ERROR]
      nullable: true

    ErrorCode:
      type: string
      description: 표준 에러 코드. 전체 목록과 발생 조건은 docs/api.md 참고.
      enum:
        - VALIDATION_ERROR
        - EMPTY_CODE
        - CODE_TOO_LONG
        - INVALID_LANGUAGE
        - REBUTTAL_TOO_SHORT
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - CASE_NOT_FOUND
        - SENTENCE_NOT_FOUND
        - EMAIL_ALREADY_REGISTERED
        - APPEAL_ALREADY_USED
        - RETRIAL_BLOCKED
        - RATE_LIMITED
        - INVALID_REPO_URL
        - REPO_FILE_UNAVAILABLE
        - GITHUB_UNAVAILABLE
        - FETCH_RATE_LIMITED
        - CSRF_CHECK_FAILED

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    UserSummary:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }

    Rule:
      type: object
      properties:
        rule_id: { type: string, example: SEC-003 }
        category: { type: string, example: SECURITY }
        title: { type: string, example: SQL 문자열 결합 }
        description: { type: string }
        default_severity: { $ref: "#/components/schemas/Severity" }
        typical_effort: { $ref: "#/components/schemas/Effort" }
        languages:
          type: array
          items: { type: string }
          description: 빈 배열이면 전 언어 공통.
        active: { type: boolean }

    PasteSubmission:
      type: object
      required: [code, language]
      properties:
        code: { type: string, maxLength: 20000 }
        language: { type: string, example: python }
        force_retrial: { type: boolean, default: false }

    LinkSubmission:
      type: object
      required: [repo_url]
      properties:
        repo_url:
          type: string
          format: uri
          example: https://github.com/octocat/sample-api/blob/a1b2c3d/src/handlers/user.py
        force_retrial: { type: boolean, default: false }

    CreateCaseRequest:
      oneOf:
        - $ref: "#/components/schemas/PasteSubmission"
        - $ref: "#/components/schemas/LinkSubmission"

    CaseSubmissionResult:
      type: object
      required: [case_id, cached]
      properties:
        case_id: { type: string, format: uuid }
        cached: { type: boolean }
        in_progress:
          type: boolean
          description: 동일 코드의 진행 중 사건을 그대로 반환한 경우에만 존재
        origin:
          type: object
          allOf: [{ $ref: "#/components/schemas/CaseOrigin" }]
          nullable: true
          description: 캐시 히트 시 원 사건의 출처(구조화된 값). CaseDetail.origin과 동일한 형태.
        origin_label:
          type: string
          nullable: true
          description: >-
            캐시 히트 안내에 바로 쓰는 표시용 문자열. GitHub 링크면
            "owner/repo@sha · path", 붙여넣기면 "붙여넣기로 제출됨".
          example: "octocat/sample-api@a1b2c3d · src/handlers/user.py"
        previous_case_id:
          type: string
          format: uuid
          description: force_retrial로 새 사건을 만들 때 이전 사건 링크

    CaseOrigin:
      type: object
      description: 붙여넣기 제출이면 repo_url/commit_sha/file_path가 전부 null
      properties:
        type: { type: string, enum: [paste, github] }
        repo_url: { type: string, format: uri, nullable: true }
        commit_sha: { type: string, nullable: true, example: a1b2c3d }
        file_path:
          { type: string, nullable: true, example: src/handlers/user.py }

    Charge:
      type: object
      properties:
        charge_index: { type: integer, minimum: 0 }
        rule_id: { type: string, example: SEC-003 }
        rule_title:
          type: string
          description: 법전 조회 결과로 채워지는 조항명(charges 테이블에는 저장되지 않음)
        evidence_start: { type: integer, minimum: 1 }
        evidence_end: { type: integer, minimum: 1 }
        charged_severity: { $ref: "#/components/schemas/Severity" }
        severity_adjusted: { type: boolean }
        severity_reason: { type: string, nullable: true }
        description: { type: string }

    Plea:
      type: object
      properties:
        charge_index: { type: integer }
        plea: { $ref: "#/components/schemas/PleaValue" }
        argument: { type: string }

    Verdict:
      type: object
      properties:
        charge_index: { type: integer }
        verdict: { $ref: "#/components/schemas/VerdictValue" }
        final_severity:
          type: string
          enum: [HIGH, MEDIUM, LOW, null]
          nullable: true
          description: DISMISSED면 null
        reasoning: { type: string }

    Sentence:
      type: object
      properties:
        sentence_id: { type: string, format: uuid }
        charge_index: { type: integer }
        task: { type: string, maxLength: 120 }
        target_start: { type: integer }
        target_end: { type: integer }
        effort: { $ref: "#/components/schemas/Effort" }
        effort_adjusted: { type: boolean }
        effort_reason: { type: string, nullable: true }
        effort_clamped: { type: boolean }
        advisory: { type: boolean }
        rationale: { type: string }
        completed_at: { type: string, format: date-time, nullable: true }

    Judgment:
      type: object
      properties:
        revision: { type: integer, enum: [0, 1] }
        opinion: { type: string }
        rebuttal_accepted:
          type: boolean
          nullable: true
          description: 재심 판결에서만 값이 있음
        precedent_verdict_ids:
          type: array
          items: { type: integer }
        verdicts:
          type: array
          items: { $ref: "#/components/schemas/Verdict" }
        sentences:
          type: array
          items: { $ref: "#/components/schemas/Sentence" }

    Appeal:
      type: object
      nullable: true
      properties:
        rebuttal: { type: string }
        created_at: { type: string, format: date-time }

    CaseDetail:
      type: object
      properties:
        case_id: { type: string, format: uuid }
        language: { type: string }
        code:
          type: string
          description: 제출된 코드 스냅샷 원문(판결문 화면의 코드 블록 렌더링용).
        status: { $ref: "#/components/schemas/CaseStatus" }
        revision: { type: integer, enum: [0, 1] }
        appeal_used: { type: boolean }
        charges_truncated: { type: boolean }
        total_lines: { type: integer }
        failed_stage: { $ref: "#/components/schemas/FailedStage" }
        failure_reason: { $ref: "#/components/schemas/FailureReason" }
        rejudgment_failed_reason:
          type: string
          nullable: true
          description: >-
            재심(REJUDGING)이 재시도 상한까지 실패했을 때만 값이 있다. 이 경우
            status는 FAILED가 아니라 원심 그대로 SENTENCED로 유지되고
            revision/판결 내용도 원심 그대로다(plan.md §4) — 이 필드만 재심
            시도가 있었고 실패했음을 알린다.
        origin: { $ref: "#/components/schemas/CaseOrigin" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        charges:
          type: array
          items: { $ref: "#/components/schemas/Charge" }
        pleas:
          type: array
          items: { $ref: "#/components/schemas/Plea" }
        judgment:
          type: object
          allOf: [{ $ref: "#/components/schemas/Judgment" }]
          nullable: true
          description: SENTENCED 전이거나 DISMISSED/FAILED면 null
        appeal:
          $ref: "#/components/schemas/Appeal"

    CaseSummary:
      type: object
      description: GET /cases 목록(전과 기록)용 축약 항목
      properties:
        case_id: { type: string, format: uuid }
        language: { type: string }
        status: { $ref: "#/components/schemas/CaseStatus" }
        origin_label:
          type: string
          description: '"owner/repo" 또는 "직접 제출"'
          example: octocat/sample-api
        charges_count: { type: integer }
        sustained_count: { type: integer }
        sentence_progress:
          type: object
          properties:
            done: { type: integer }
            total: { type: integer }
        created_at: { type: string, format: date-time }

    CaseListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    RuleFrequencyItem:
      type: object
      properties:
        rule_id: { type: string, example: SEC-003 }
        rule_title: { type: string, example: SQL 문자열 결합 }
        count: { type: integer }

    RuleFrequencyResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RuleFrequencyItem" }

    CaseProgress:
      type: object
      properties:
        status: { $ref: "#/components/schemas/CaseStatus" }
        revision: { type: integer, enum: [0, 1] }
        appeal_used: { type: boolean }

    AppealRequest:
      type: object
      required: [rebuttal]
      properties:
        rebuttal: { type: string, minLength: 20 }

    SentenceToggleRequest:
      type: object
      required: [completed]
      properties:
        completed: { type: boolean }

    SentenceToggleResponse:
      type: object
      properties:
        sentence_id: { type: string, format: uuid }
        completed_at: { type: string, format: date-time, nullable: true }
        progress:
          type: object
          properties:
            done: { type: integer }
            total: { type: integer }
